name: Weekly database backup

on:
  schedule:
    - cron: '17 3 * * 0' # Sundays, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Neon runs Postgres 17 and pg_dump must be at least that new.
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-common gnupg
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      # This repo is public and anyone signed in to GitHub can download its workflow
      # artifacts, so the dump is encrypted. Only the public key lives here; the private
      # key stays on the owner's machine.
      - name: Dump and encrypt
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: |
          gpg --import .github/backup-public-key.asc
          FPR=$(gpg --list-keys --with-colons backups@bad-horror-club.invalid | awk -F: '/^fpr/ {print $10; exit}')
          /usr/lib/postgresql/17/bin/pg_dump --no-owner --no-privileges "$DATABASE_URL" \
            | gzip \
            | gpg --batch --trust-model always --encrypt --recipient "$FPR" \
              --output "backup-$(date -u +%F).sql.gz.gpg"
          ls -l backup-*.sql.gz.gpg

      - uses: actions/upload-artifact@v4
        with:
          name: database-backup
          path: backup-*.sql.gz.gpg
          retention-days: 90
          if-no-files-found: error
